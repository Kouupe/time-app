name: Test Application
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install flask requests
      
      - name: Run app in background
        run: |
          python src/app.py &
          sleep 3
      
      - name: Test /time endpoint
        run: |
          python test/test_time.py
      
      - name: Test /metrics endpoint
        run: |
          python test/test_metrics_integration.py
